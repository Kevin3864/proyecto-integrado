{% extends 'base.html' %}

{% block content %}
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            Confirmar Eliminación
        </div>
        <div class="card-body">
            <p>¿Estás seguro de que deseas eliminar {{ tipo }}: <strong>{{ objeto }}</strong>?</p>
            
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url url_lista %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
