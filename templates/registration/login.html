{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-primary text-white text-center py-4">
                <!-- Icono grande y título -->
                <h2 class="mb-0"><i class="bi bi-person-circle me-2"></i></h2>
                <h4 class="font-weight-light my-2">Iniciar Sesión</h4>
            </div>
            <div class="card-body p-5">
                
                <!-- Formulario de Login -->
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- Renderizamos el formulario con Crispy para que se vea bien -->
                    {{ form|crispy }}

                    <!-- Botón de entrar -->
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg font-weight-bold">
                            Entrar <i class="bi bi-box-arrow-in-right ms-2"></i>
                        </button>
                    </div>
                </form>

            </div>
            <div class="card-footer text-center py-3">
                <div class="small">
                    <a href="#" class="text-muted">¿Olvidaste tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
