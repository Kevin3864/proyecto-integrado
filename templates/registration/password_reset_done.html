{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-lg text-center">

            <div class="card-body p-5">

                <!-- Icono -->
                <div class="text-success mb-4">
                    <i class="bi bi-envelope-check-fill" style="font-size: 4rem;"></i>
                </div>

                <!-- Título -->
                <h3 class="fw-bold">¡Correo Enviado!</h3>

                <!-- Mensaje -->
                <p class="text-muted mt-3">
                    Te hemos enviado las instrucciones para restablecer tu contraseña.
                    <br>
                    Si no lo recibes en unos minutos, revisa tu carpeta de <b>spam</b> o <b>correo no deseado</b>.
                </p>

                <!-- Botón -->
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-4">
                        <i class="bi bi-box-arrow-in-right me-1"></i>
                        Volver al Login
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
