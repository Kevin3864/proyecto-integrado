{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-lg text-center">
            <div class="card-body p-5">

                <!-- Ícono -->
                <div class="text-primary mb-4">
                    <i class="bi bi-shield-lock-fill" style="font-size: 4rem;"></i>
                </div>

                <!-- Título -->
                <h3 class="fw-bold">¡Contraseña Cambiada!</h3>

                <!-- Mensaje -->
                <p class="text-muted mt-3">
                    Tu contraseña ha sido restablecida correctamente.  
                    Ahora puedes ingresar con tus nuevas credenciales.
                </p>

                <!-- Botón -->
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg px-5">
                        Iniciar Sesión
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
